<style>
:root{

*{box-sizing:border-box;}
body{margin:0;background:#000;color:var(--texto);font-family:"Courier New",monospace;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
#app{max-width:900px;margin:10px auto;background:var(--fondo);border:5px solid var(--marco);padding:6px;user-select:none;}
.menubar{display:flex;background:var(--menu);position:relative;}
.menuitem{padding:8px 14px;cursor:pointer;font-weight:bold;letter-spacing:1px;}
.menuitem:hover,.menuitem.open{background:var(--activo);color:#000;}
.dropdown{position:absolute;top:100%;left:0;background:var(--menu);border:2px solid var(--marco);z-index:10;min-width:170px;display:none;}
.dropdown.show{display:block;}
.dropdown div{padding:6px 10px;cursor:pointer;white-space:nowrap;}
.dropdown div:hover{background:var(--activo);color:#000;}
.fxbar{background:var(--celda);border:2px solid var(--marco);margin-top:6px;padding:6px 8px;display:flex;gap:8px;align-items:center;}
.fxbar b{white-space:nowrap;}
.fxbar input{flex:1;background:#083a3a;color:var(--texto);border:1px solid var(--marco);font-family:inherit;padding:4px;font-size:14px;}
.gridwrap{overflow-x:auto;margin-top:6px;border:2px solid var(--marco);background:var(--fondo);}
table{border-collapse:collapse;font-size:12px;}
td,th{border:1px solid var(--marco);padding:0;min-width:44px;height:22px;text-align:center;background:var(--celda);}
th{background:var(--menu);}
td.cell{cursor:pointer;background:var(--celda);}
td.cell.active{outline:2px solid var(--activo);outline-offset:-2px;background:#2aa0a0;}
.rowhead{background:var(--menu);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;}
.overlay.show{display:flex;}
.dialog{background:var(--celda);border:3px solid var(--marco);padding:16px;min-width:280px;}
.dialog.wide{max-width:90vw;max-height:85vh;width:800px;display:flex;flex-direction:column;}
.dialog pre{background:#062626;color:#9fe8c8;padding:12px;border:1px solid var(--marco);
  overflow:auto;max-height:65vh;font-size:12px;line-height:1.4;margin:0 0 10px;white-space:pre;}
.dialog p{margin:0 0 10px;}
.dialog input{width:100%;background:#083a3a;color:var(--texto);border:1px solid var(--marco);padding:6px;font-family:inherit;margin-bottom:10px;}
.dialog button{background:var(--menu);color:var(--texto);border:1px solid var(--marco);padding:6px 12px;cursor:pointer;margin-right:6px;}
.dialog button:hover{background:var(--activo);color:#000;}
.hint{font-size:11px;opacity:.8;margin-top:6px;}
</style>

<script>
const COLS=20, ROWS=10; // A..T, 1..10
let data=[]; // data[col][row] = formula string
let clipboard='';
let selCol=0, selRow=0;
for(let c=0;c<COLS;c++){data.push(new Array(ROWS).fill(''));}

const gridEl=document.getElementById('grid');
const fxEl=document.getElementById('fx');
const activeCellEl=document.getElementById('activeCell');

function colLetter(c){return String.fromCharCode(65+c);}

function buildGrid(){
  let html='<tr><th></th>';
  for(let c=0;c<COLS;c++) html+=`<th>${colLetter(c)}</th>`;
  html+='</tr>';
  for(let r=0;r<ROWS;r++){
    html+=`<tr><th class="rowhead">${r+1}</th>`;
    for(let c=0;c<COLS;c++){
      html+=`<td class="cell" data-c="${c}" data-r="${r}" id="c${c}_${r}"></td>`;
    }
    html+='</tr>';
  }
  gridEl.innerHTML=html;
  gridEl.querySelectorAll('td.cell').forEach(td=>{
    td.addEventListener('click',()=>selectCell(+td.dataset.c,+td.dataset.r));
  });
}

function evalCell(c,r,depth){
  if(depth>25) return NaN; // circular guard
  const f=data[c][r];
  if(f==='' ) return 0;
  if(f[0]!=='='){
    const n=parseInt(f,10);
    return isNaN(n)?NaN:n;
  }
  const expr=f.slice(1).toUpperCase();
  // left/right can each be EITHER a cell ref (A-T, 1-10) OR a plain number
  const m=expr.match(/^((?:[A-T](?:10|[1-9]))|(?:\d{1,4}))([+\-*/])((?:[A-T](?:10|[1-9]))|(?:\d{1,4}))$/);
  if(!m) return NaN;
  const [,leftTok,op,rightTok]=m;
  function resolve(tok){
    const mm=tok.match(/^([A-T])(10|[1-9])$/);
    if(mm){
      const cc=mm[1].charCodeAt(0)-65, rr=parseInt(mm[2],10)-1;
      return (cc===c&&rr===r)?NaN:evalCell(cc,rr,depth+1);
    }
    return parseInt(tok,10);
  }
  let left=resolve(leftTok);
  let right=resolve(rightTok);
  if(isNaN(left)||isNaN(right)) return NaN;
  switch(op){
    case '+': return left+right;
    case '-': return left-right;
    case '*': return left*right;
    case '/': return right===0?NaN:Math.trunc(left/right);
  }
  return NaN;
}

function refresh(){
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){
    const td=document.getElementById(`c${c}_${r}`);
    td.classList.toggle('active', c===selCol&&r===selRow);
    if(data[c][r]===''){ td.textContent=''; continue; }
    const v=evalCell(c,r,0);
    td.textContent=isNaN(v)?'####':v;
  }
  activeCellEl.textContent=colLetter(selCol)+(selRow+1);
  fxEl.value=data[selCol][selRow];
}

function selectCell(c,r){ selCol=c; selRow=r; refresh(); fxEl.focus(); }

fxEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    data[selCol][selRow]=fxEl.value;
    moveSel(0,1);
  }
});
fxEl.addEventListener('change',()=>{ data[selCol][selRow]=fxEl.value; refresh(); });

function moveSel(dc,dr){
  let c=selCol+dc, r=selRow+dr;
  if(c<0)c=COLS-1; if(c>=COLS)c=0;
  if(r<0)r=ROWS-1; if(r>=ROWS)r=0;
  selCol=c; selRow=r; refresh();
}

document.addEventListener('keydown',e=>{
  if(document.activeElement===fxEl && !['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) return;
  if(document.activeElement===fxEl && e.key==='ArrowLeft' && fxEl.selectionStart>0) return;
  if(document.activeElement===fxEl && e.key==='ArrowRight' && fxEl.selectionEnd<fxEl.value.length) return;
  if(e.key==='ArrowUp'){moveSel(0,-1);e.preventDefault();}
  else if(e.key==='ArrowDown'){moveSel(0,1);e.preventDefault();}
  else if(e.key==='ArrowLeft'){moveSel(-1,0);e.preventDefault();}
  else if(e.key==='ArrowRight'){moveSel(1,0);e.preventDefault();}
});

// ---- Menu handling ----
const menubar=document.getElementById('menubar');
let openMenu=null;
menubar.querySelectorAll('.menuitem').forEach(mi=>{
  mi.addEventListener('click',(e)=>{
    e.stopPropagation();
    const key=mi.dataset.m;
    const dd=document.getElementById('dd-'+key);
    const isOpen=dd.classList.contains('show');
    closeMenus();
    if(!isOpen){ dd.classList.add('show'); mi.classList.add('open'); openMenu=key; }
  });
});
document.addEventListener('click',closeMenus);
function closeMenus(){
  document.querySelectorAll('.dropdown').forEach(d=>d.classList.remove('show'));
  document.querySelectorAll('.menuitem').forEach(m=>m.classList.remove('open'));
  openMenu=null;
}

document.querySelectorAll('.dropdown div').forEach(item=>{
  item.addEventListener('click',(e)=>{
    e.stopPropagation();
    closeMenus();
    handleAction(item.dataset.act);
  });
});

function handleAction(act){
  switch(act){
    case 'nuevo':
      for(let c=0;c<COLS;c++)data[c]=new Array(ROWS).fill('');
      selCol=0;selRow=0; refresh();
      break;
    case 'salir':
      showDialog(`<p>SALIR</p><p>Esta es una recreacion web — no hay proceso que cerrar.</p><button data-close>Aceptar</button>`);
      break;
    case 'copiar':
      clipboard=data[selCol][selRow];
      break;
    case 'cortar':
      clipboard=data[selCol][selRow];
      data[selCol][selRow]='';
      refresh();
      break;
    case 'pegar':
      data[selCol][selRow]=clipboard;
      refresh();
      break;
    case 'buscar': doBuscar(); break;
    case 'reemplazar': doReemplazar(); break;
    case 'sumar': doWizard('+'); break;
    case 'restar': doWizard('-'); break;
    case 'multiplicar': doWizard('*'); break;
    case 'dividir': doWizard('/'); break;
    case 'acerca':
      showDialog(`<p><b>EMANUEL HERRERA</b></p><p>SCJ_15@hotmail.com</p><p>Xcel v5.0</p><button data-close>Aceptar</button>`);
      break;
    case 'manual':
      showDialog(`<p><b>MANUAL</b></p><p>Escribe un numero o una formula que empiece con "=" (ej. =A1+B2, =A1+50, =50*3). Usa las flechas o haz clic para moverte entre celdas. EDICION tiene copiar/cortar/pegar y buscar/reemplazar por valor. HERRAMIENTAS construye una formula pidiendo dos numeros.</p><button data-close>Aceptar</button>`);
      break;
  }
}

function showDialog(html, wide){
  const box=document.getElementById('dialogBox');
  box.innerHTML=html;
  box.classList.toggle('wide', !!wide);
  document.getElementById('overlay').classList.add('show');
  box.querySelectorAll('[data-close]').forEach(b=>
    b.addEventListener('click',()=>document.getElementById('overlay').classList.remove('show')));
}

document.getElementById('tab-codigo').addEventListener('click',(e)=>{
  e.stopPropagation();
  closeMenus();
  showDialog(`<p><b>XCEL_5.CPP</b> (codigo original en Turbo C++)</p><pre>${ORIGINAL_CPP_CODE}</pre><button data-close>Cerrar</button>`, true);
});

function doBuscar(){
  showDialog(`<p>Ingrese valor a buscar</p><input id="bv" type="number"><button id="bvGo">Buscar</button><button data-close>Cancelar</button>`);
  document.getElementById('bvGo').onclick=()=>{
    const val=parseInt(document.getElementById('bv').value,10);
    let found=false;
    for(let c=0;c<COLS&&!found;c++)for(let r=0;r<ROWS&&!found;r++){
      if(evalCell(c,r,0)===val){ selCol=c; selRow=r; found=true; }
    }
    document.getElementById('overlay').classList.remove('show');
    refresh();
    if(!found) showDialog(`<p>No existe el valor.</p><button data-close>Aceptar</button>`);
  };
}

function doReemplazar(){
  showDialog(`<p>Ingrese valor a buscar</p><input id="rb" type="number">
    <p>Ingrese valor a reemplazar</p><input id="rr">
    <button id="rGo">Reemplazar</button><button data-close>Cancelar</button>`);
  document.getElementById('rGo').onclick=()=>{
    const val=parseInt(document.getElementById('rb').value,10);
    const rep=document.getElementById('rr').value;
    let found=false;
    for(let c=0;c<COLS&&!found;c++)for(let r=0;r<ROWS&&!found;r++){
      if(evalCell(c,r,0)===val){ data[c][r]=rep; selCol=c; selRow=r; found=true; }
    }
    document.getElementById('overlay').classList.remove('show');
    refresh();
    if(!found) showDialog(`<p>No existe el valor.</p><button data-close>Aceptar</button>`);
  };
}

function doWizard(op){
  showDialog(`<p>Ingrese valor numero 1</p><input id="w1" type="number">
    <p>Ingrese valor numero 2</p><input id="w2" type="number">
    <button id="wGo">Aceptar</button><button data-close>Cancelar</button>`);
  document.getElementById('wGo').onclick=()=>{
    const v1=document.getElementById('w1').value;
    const v2=document.getElementById('w2').value;
    data[selCol][selRow]=`=${v1}${op}${v2}`;
    document.getElementById('overlay').classList.remove('show');
    refresh();
  };
}
